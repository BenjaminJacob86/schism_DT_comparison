# Original schismview conda spec (Dash/Plotly GUI). Kept as reference only.
# This viewer uses ../environment.yml + requirements.txt instead.
name: schismview
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.12
  - xarray>=2024.6
  - dask>=2024.6
  - netcdf4>=1.6
  - h5netcdf>=1.3
  - pandas>=2.2
  - plotly>=5.22
  - dash>=2.17
  - dash-bootstrap-components>=1.6
  - matplotlib>=3.8
  - cmocean>=4.0
  - cartopy>=0.23
  - pillow>=10.0
  - pytest>=8.0
  - pip
  - pip:
      - kaleido>=0.2.1
